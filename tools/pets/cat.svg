<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 92" width="560" height="736"><title>The cat, sitting up (515 Cap Rock)</title>
<g class="pet-cat" stroke="#3a3936" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
  <!-- tail curls up behind her, flicks from the base (50,84) -->
  <g class="cat-tail"><path d="M50 84 C63 86 67 75 60 66" fill="none" stroke-width="4" stroke="#3a3936"/><path d="M50 84 C63 86 67 75 60 66" fill="none" stroke-width="2.2" stroke="#d6d2cb"/></g>
  <!-- sitting body -->
  <path d="M20 87 C16 64 23 41 35 39 C47 41 54 64 50 87 Z" fill="#d6d2cb"/>
  <ellipse cx="35" cy="60" rx="7.5" ry="12" fill="#e4e0d9" stroke="none"/>
  <path d="M30.5 72 L30.5 84 M39.5 72 L39.5 84" fill="none" stroke="#a8a39b" stroke-width="1"/>
  <ellipse cx="30" cy="86.5" rx="4.2" ry="2.6" fill="#e4e0d9"/><ellipse cx="40" cy="86.5" rx="4.2" ry="2.6" fill="#e4e0d9"/>
  <path d="M22 70 q3 -3 6 0 M43 62 q3 -3 6 0" fill="none" stroke="#a8a39b" stroke-width="1.1"/>
  <!-- head: idle ear twitch and blink pivot at the neck (35,45) -->
  <g class="cat-head">
    <path d="M23.5 31 L25 13.5 L33.5 22 Z" fill="#d6d2cb"/>
    <path d="M36.5 22 L45 13.5 L46.5 31 Z" fill="#d6d2cb"/>
    <path d="M26 24 L26.6 17.5 L30.5 21.5 Z M43.5 24 L43.4 17.5 L39.5 21.5 Z" fill="#e8cdc6" stroke="none"/>
    <ellipse cx="35" cy="31" rx="13" ry="11.5" fill="#d6d2cb"/>
    <path d="M31 22.5 q2 -3 4 0 M35.5 22 q2 -3 4 0" fill="none" stroke="#a8a39b" stroke-width="1.1"/>
    <g class="cat-eyes" stroke="none" fill="#3a3936"><ellipse cx="30" cy="31" rx="1.6" ry="2.3"/><ellipse cx="40" cy="31" rx="1.6" ry="2.3"/></g>
    <path d="M33.8 35 l1.2 1.2 l1.2 -1.2 Z" fill="#3a3936" stroke-width="0.8"/>
    <path d="M35 36.3 q-1.4 1.9 -3 0.7 M35 36.3 q1.4 1.9 3 0.7" fill="none" stroke-width="0.9"/>
    <path d="M27 35 l-7 -1 M27 37 l-7 1.2 M43 35 l7 -1 M43 37 l7 1.2" fill="none" stroke="#a8a39b" stroke-width="0.7"/>
  </g>
</g>
</svg>
