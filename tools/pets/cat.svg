<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" width="800" height="1000"><title>The cat, a Russian Blue sitting tall (515 Cap Rock)</title>
<g class="pet-cat" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="20" cy="48.9" rx="15" ry="0.9" fill="#000" opacity=".14"/>
  <!-- body: tall, elegant sit -->
  <path d="M10.2 48.4 C7.6 41 9.2 30.6 14.2 25.2 L25.8 25.2 C30.8 30.6 32.4 41 29.8 48.4 Z" fill="#7f90a5" stroke="#2c3138" stroke-width="1.05"/>
  <!-- silver-tipped plush coat: soft sheen down the chest and flank -->
  <path d="M16.4 27.4 C14.6 32 14.8 39 16.6 44.6 C18 40 18.4 33 16.4 27.4 Z" fill="#a9b8c9" opacity=".75"/>
  <path d="M27.4 33 C28.6 37 28.4 42 27.2 46" fill="none" stroke="#6a7a8e" stroke-width="1"/>
  <path d="M12.6 35 q1.2 -0.9 2.4 0 M24.6 30.6 q1.2 -0.9 2.4 0 M22.8 38.6 q1.2 -0.9 2.4 0" fill="none" stroke="#bcc9d6" stroke-width="0.7"/>
  <!-- front legs and neat paws -->
  <path d="M15.2 36 L15 47.2 M24.8 36 L25 47.2" stroke="#2c3138" stroke-width="0.85"/>
  <ellipse cx="16.6" cy="47.6" rx="2.6" ry="1.25" fill="#8a9bb0" stroke="#2c3138" stroke-width="0.95"/>
  <ellipse cx="23.4" cy="47.6" rx="2.6" ry="1.25" fill="#8a9bb0" stroke="#2c3138" stroke-width="0.95"/>
  <!-- tail wrapped around the paws; the tip flicks -->
  <path d="M29.6 46.6 C33 47.8 34.6 45.6 33.4 43.4" fill="none" stroke="#2c3138" stroke-width="3.4"/>
  <path d="M29.6 46.6 C33 47.8 34.6 45.6 33.4 43.4" fill="none" stroke="#7f90a5" stroke-width="1.9"/>
  <g class="cat-tail"><path d="M33.4 43.4 C32.6 41.4 33.4 39.4 35.2 38.6" fill="none" stroke="#2c3138" stroke-width="3.4"/>
    <path d="M33.4 43.4 C32.6 41.4 33.4 39.4 35.2 38.6" fill="none" stroke="#7f90a5" stroke-width="1.9"/></g>
  <g class="cat-head">
    <!-- tall pointed ears, mauve inside -->
    <path d="M11 13.4 L10.4 2.6 L17.2 8.2 Z" fill="#7f90a5" stroke="#2c3138" stroke-width="1.05"/>
    <path d="M29 13.4 L29.6 2.6 L22.8 8.2 Z" fill="#7f90a5" stroke="#2c3138" stroke-width="1.05"/>
    <path d="M12 11.6 L11.6 5 L15.6 8.6 Z" fill="#b39fb6"/><path d="M28 11.6 L28.4 5 L24.4 8.6 Z" fill="#b39fb6"/>
    <!-- wedge head with a soft plush cheek -->
    <path d="M10.6 14 C10.6 8.6 14.6 6.6 20 6.6 C25.4 6.6 29.4 8.6 29.4 14 C29.4 20.4 25 25.6 20 25.6 C15 25.6 10.6 20.4 10.6 14 Z" fill="#8293a8" stroke="#2c3138" stroke-width="1.1"/>
    <path d="M14.2 9.4 q1.4 1.4 1.2 3.2 M20 8.4 v2.8 M25.8 9.4 q-1.4 1.4 -1.2 3.2" fill="none" stroke="#6a7a8e" stroke-width="0.7"/>
    <path d="M16.6 19.4 C17.6 22.6 22.4 22.6 23.4 19.4 C22.2 18.4 17.8 18.4 16.6 19.4 Z" fill="#a9b8c9" opacity=".8"/>
    <!-- vivid green eyes with slit pupils -->
    <g class="cat-eyes">
      <ellipse cx="15.6" cy="15" rx="2.55" ry="2.25" fill="#3fcf72" stroke="#1f6e3d" stroke-width="0.7"/>
      <ellipse cx="24.4" cy="15" rx="2.55" ry="2.25" fill="#3fcf72" stroke="#1f6e3d" stroke-width="0.7"/>
      <ellipse cx="15.6" cy="15" rx="0.62" ry="1.75" fill="#14161a"/><ellipse cx="24.4" cy="15" rx="0.62" ry="1.75" fill="#14161a"/>
      <circle cx="16.3" cy="14.1" r="0.55" fill="#ffffff"/><circle cx="25.1" cy="14.1" r="0.55" fill="#ffffff"/>
    </g>
    <!-- slate nose, small mouth, silver whiskers -->
    <path d="M18.8 18.2 L21.2 18.2 L20 19.5 Z" fill="#525a66" stroke="#2c3138" stroke-width="0.5"/>
    <path d="M20 19.5 v0.9 M20 20.4 q-1.2 1 -2.2 0.3 M20 20.4 q1.2 1 2.2 0.3" fill="none" stroke="#2c3138" stroke-width="0.6"/>
    <path d="M16.4 19.6 L10 18.6 M16.4 20.4 L10.2 20.8 M23.6 19.6 L30 18.6 M23.6 20.4 L29.8 20.8" stroke="#e3e9ef" stroke-width="0.45"/>
  </g>
</g>
</svg>
