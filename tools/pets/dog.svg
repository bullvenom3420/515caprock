    <g stroke="#3a3936" stroke-width="1.2"><circle cx="549.0" cy="738.0" r="5.2" fill="#f6f3ee"/><circle cx="546.7" cy="742.7" r="5.2" fill="#f6f3ee"/><circle cx="541.7" cy="743.8" r="5.2" fill="#f6f3ee"/><circle cx="537.6" cy="740.6" r="5.2" fill="#f6f3ee"/><circle cx="537.6" cy="735.4" r="5.2" fill="#f6f3ee"/><circle cx="541.7" cy="732.2" r="5.2" fill="#f6f3ee"/><circle cx="546.7" cy="733.3" r="5.2" fill="#f6f3ee"/><circle cx="585.0" cy="738.0" r="5.2" fill="#f6f3ee"/><circle cx="582.7" cy="742.7" r="5.2" fill="#f6f3ee"/><circle cx="577.7" cy="743.8" r="5.2" fill="#f6f3ee"/><circle cx="573.6" cy="740.6" r="5.2" fill="#f6f3ee"/><circle cx="573.6" cy="735.4" r="5.2" fill="#f6f3ee"/><circle cx="577.7" cy="732.2" r="5.2" fill="#f6f3ee"/><circle cx="582.7" cy="733.3" r="5.2" fill="#f6f3ee"/></g>
    <g stroke="#3a3936" stroke-width="1.3"><circle cx="575.0" cy="731.0" r="5.4" fill="#f6f3ee"/><circle cx="573.1" cy="738.0" r="5.4" fill="#f6f3ee"/><circle cx="568.0" cy="743.1" r="5.4" fill="#f6f3ee"/><circle cx="561.0" cy="745.0" r="5.4" fill="#f6f3ee"/><circle cx="554.0" cy="743.1" r="5.4" fill="#f6f3ee"/><circle cx="548.9" cy="738.0" r="5.4" fill="#f6f3ee"/><circle cx="547.0" cy="731.0" r="5.4" fill="#f6f3ee"/><circle cx="548.9" cy="724.0" r="5.4" fill="#f6f3ee"/><circle cx="554.0" cy="718.9" r="5.4" fill="#f6f3ee"/><circle cx="561.0" cy="717.0" r="5.4" fill="#f6f3ee"/><circle cx="568.0" cy="718.9" r="5.4" fill="#f6f3ee"/><circle cx="573.1" cy="724.0" r="5.4" fill="#f6f3ee"/></g>
    <circle cx="561" cy="731" r="14.5" fill="#f6f3ee"/>
    <path d="M551.2 724.6 Q555.4 721.4 559.6 724.2" fill="none" stroke="#1f1e22" stroke-width="2.4"/>
    <path d="M550 720 q4 -5 8 -1 q4 -5 8 -1 q4 -4 7 1" fill="none" stroke="#d8d1c6" stroke-width="1.1"/>
    <g class="dog-eyes"><circle cx="555.5" cy="728.5" r="1.9" fill="#1f1e22"/><circle cx="567" cy="728.5" r="1.9" fill="#1f1e22"/></g>
    <ellipse cx="561" cy="738.5" rx="8" ry="5.6" fill="#fbf9f4" stroke="#cfc8bc" stroke-width="0.9"/>
    <ellipse cx="561" cy="735.6" rx="3.1" ry="2.3" fill="#1f1e22"/>
    <path d="M558 740.5 Q561 743.5 564 740.5" fill="none" stroke="#3a3936" stroke-width="1.1"/>
  </g></g>
</g>
