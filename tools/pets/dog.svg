<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 132" width="600" height="792"><title>Huckleberry, sitting (515 Cap Rock)</title>
<g class="pet-dog" stroke-linejoin="round" stroke-linecap="round">
  <!-- fluffy white plume tail, wags from the base (73,110) -->
  <g class="dog-tail"><path d="M73 110 C85 107 91 98 87 88" fill="none" stroke="#3a3936" stroke-width="9.5"/><path d="M73 110 C85 107 91 98 87 88" fill="none" stroke="#f6f3ee" stroke-width="7.5"/>
    <circle cx="86.5" cy="87" r="5.4" fill="#f6f3ee" stroke="#3a3936" stroke-width="1"/></g>
  <!-- back feet -->
  <g stroke="#3a3936" stroke-width="1.2" fill="#f6f3ee"><ellipse cx="27" cy="124" rx="7.5" ry="3.6"/><ellipse cx="73" cy="124" rx="7.5" ry="3.6"/></g>
  <!-- sitting haunches and chest -->
  <g stroke="#3a3936" stroke-width="1.4" fill="#f6f3ee">
    <path d="M23 125 C18 101 28 78 50 74 C72 78 82 101 77 125 Z"/>
    <ellipse cx="50" cy="81" rx="16.5" ry="21"/>
  </g>
  <path d="M28 104 q4 -4 8 0 M64 104 q4 -4 8 0 M30 114 q4 -4 8 0 M62 114 q4 -4 8 0" fill="none" stroke="#d8d1c6" stroke-width="1.1"/>
  <!-- front legs and curly paws -->
  <g stroke="#3a3936" stroke-width="1.2" fill="#f6f3ee">
    <rect x="39.5" y="92" width="8" height="30" rx="4"/><rect x="52.5" y="92" width="8" height="30" rx="4"/>
    <circle cx="41" cy="123" r="3"/><circle cx="46" cy="123" r="3"/><circle cx="43.5" cy="124.6" r="3"/>
    <circle cx="54" cy="123" r="3"/><circle cx="59" cy="123" r="3"/><circle cx="56.5" cy="124.6" r="3"/>
  </g>
  <!-- red bandana -->
  <g transform="translate(-511 -685)" stroke="#3a3936" stroke-width="1.2" stroke-linejoin="round">
    <path d="M546 744.5 Q561 750.5 576 744.5 L573.5 749.5 L561 761.5 L548.5 749.5 Z" fill="#c8372d"/>
    <path d="M550 748.5 Q561 753 572 748.5" fill="none" stroke="#9e2a22" stroke-width="0.9"/>
    <circle cx="556" cy="752" r="0.9" fill="#f6f3ee" stroke="none"/><circle cx="566" cy="752" r="0.9" fill="#f6f3ee" stroke="none"/><circle cx="561" cy="756.5" r="0.9" fill="#f6f3ee" stroke="none"/>
  </g>
